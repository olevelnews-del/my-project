name: Test Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check HTML validity
        run: |
          echo "Checking all HTML files..."
          count=0
          errors=0
          for f in $(find . -name '*.html' -not -path './.git/*'); do
            count=$((count + 1))
            if ! grep -q '<!DOCTYPE html>' "$f"; then
              echo "ERROR: $f missing DOCTYPE"
              errors=$((errors+1))
            fi
            if ! grep -q '</html>' "$f"; then
              echo "ERROR: $f missing closing html tag"
              errors=$((errors+1))
            fi
            if ! grep -q '</head>' "$f"; then
              echo "ERROR: $f missing closing head tag"
              errors=$((errors+1))
            fi
            if ! grep -q '</body>' "$f"; then
              echo "ERROR: $f missing closing body tag"
              errors=$((errors+1))
            fi
          done
          echo "✓ All $count HTML files pass basic validation"
          if [ $errors -gt 0 ]; then exit 1; fi
      
      - name: Verify JS data loads
        run: |
          if [ -f "js/site-data.js" ]; then
            if grep -q 'const siteData' js/site-data.js; then
              echo "✓ site-data.js has correct export"
            else
              echo "ERROR: site-data.js missing siteData export"
              exit 1
            fi
            size=$(wc -c < js/site-data.js)
            echo "✓ site-data.js is ${size} bytes"
          else
            echo "WARNING: site-data.js not found (optional)"
          fi
          
          if [ -f "js/site-data.json" ]; then
            python3 -c "import json; d=json.load(open('js/site-data.json')); print(f'✓ JSON valid: {len(d[\"courses\"])} courses, {len(d[\"bundles\"])} bundles')"
          else
            echo "WARNING: site-data.json not found (optional)"
          fi
          
      - name: Check page links
        run: |
          # Collect all valid file paths
          find . -type f -not -path './.git/*' | sed 's|^\./||' > /tmp/valid_files.txt
          
          errors=0
          for f in $(find . -name '*.html' -not -path './.git/*'); do
            hrefs=$(grep -oE 'href="[^"]*"' "$f" | sed 's/href="//;s/"$//' | grep -v '^http' | grep -v '^#' | grep -v '^javascript:' | grep -v '^//')
            for h in $hrefs; do
              # Strip query string and fragment
              target=$(echo "$h" | sed 's/[?#].*//')
              target="${target#/}"
              [ -z "$target" ] && continue
              
              # Normalize: handle both /dir/ (→ dir/index.html) and /file (→ file.html)
              normalized=""
              if echo "$target" | grep -q '/$'; then
                # Directory path → look for index.html inside it
                normalized="$(dirname "$target")/index.html"
              else
                # Could be file or directory without trailing slash
                normalized="$target.html"
              fi
              
              if ! grep -qF "$normalized" /tmp/valid_files.txt; then
                echo "BROKEN LINK in $(basename $f): $h (resolved to $normalized)"
                errors=$((errors + 1))
              fi
            done
          done
          if [ $errors -gt 0 ]; then
            echo "✗ Found $errors broken link(s)"
            exit 1
          else
            echo "✓ No broken internal links found"
          fi
          
      - name: Count deliverables
        run: |
          html=$(find . -name '*.html' -not -path './.git/*' | wc -l)
          css=$(find . -name '*.css' -not -path './.git/*' | wc -l)
          js=$(find . -name '*.js' -not -path './.git/*' | wc -l)
          total=$(find . -type f -not -path './.git/*' | wc -l)
          echo "📊 Summary: $html HTML pages, $css CSS files, $js JS files ($total files total)"
