name: Test Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check HTML validity
        run: |
          echo "Checking all HTML files..."
          count=0
          errors=0
          for f in $(find . -name '*.html' -not -path './.git/*'); do
            count=$((count + 1))
            if ! grep -q '<!DOCTYPE html>' "$f"; then
              echo "ERROR: $f missing DOCTYPE"
              errors=$((errors+1))
            fi
            if ! grep -q '</html>' "$f"; then
              echo "ERROR: $f missing closing html tag"
              errors=$((errors+1))
            fi
            if ! grep -q '</head>' "$f"; then
              echo "ERROR: $f missing closing head tag"
              errors=$((errors+1))
            fi
            if ! grep -q '</body>' "$f"; then
              echo "ERROR: $f missing closing body tag"
              errors=$((errors+1))
            fi
          done
          echo "OK All $count HTML files pass basic validation"
          if [ $errors -gt 0 ]; then exit 1; fi

      - name: Verify JS data loads
        run: |
          if [ -f "js/site-data.js" ]; then
            if grep -q 'const siteData' js/site-data.js; then
              echo "OK site-data.js has correct export"
            else
              echo "ERROR: site-data.js missing siteData export"
              exit 1
            fi
            size=$(wc -c < js/site-data.js)
            echo "OK site-data.js is ${size} bytes"
          else
            echo "WARN site-data.js not found"
          fi
          if [ -f "js/site-data.json" ]; then
            python3 -c "import json; d=json.load(open('js/site-data.json')); print(f'OK JSON valid: {len(d[\"courses\"])} courses, {len(d[\"bundles\"])} bundles')"
          else
            echo "WARN site-data.json not found"
          fi

      - name: Check page links
        run: |
          find . -type f -not -path './.git/*' | sed 's|^\./||' > /tmp/valid_files.txt
          errors=0
          for f in $(find . -name '*.html' -not -path './.git/*'); do
            hrefs=$(grep -oE 'href="[^"]*"' "$f" | sed 's/href="//;s/"$//' | grep -v '^http' | grep -v '^#' | grep -v '^javascript:' | grep -v '^//' | grep -v '\${')
            for h in $hrefs; do
              # Skip query-string URLs (e.g., /bundles/?group=science)
              target=$(echo "$h" | sed 's/[?#].*//')
              target="${target#/}"
              [ -z "$target" ] && continue
              found=false
              # Root path resolves to index.html
              if [ "$target" = "index.html" ]; then found=true; fi
              # Case 1: direct file match
              if [ "$found" = false ]; then
                if grep -qF "$target" /tmp/valid_files.txt; then found=true; fi
              fi
              # Case 2: dir/index.html (for paths like bundles/)
              if [ "$found" = false ]; then
                idx_path="${target%/}/index.html"
                if grep -qF "$idx_path" /tmp/valid_files.txt; then found=true; fi
              fi
              # Case 3: add .html extension
              if [ "$found" = false ]; then
                html_path="${target}.html"
                if grep -qF "$html_path" /tmp/valid_files.txt; then found=true; fi
              fi
              # Case 4: strip trailing slash then add .html (e.g., bundles/full-platform/)
              if [ "$found" = false ]; then
                html_path="$(echo "$target" | sed 's|/$||').html"
                if grep -qF "$html_path" /tmp/valid_files.txt; then found=true; fi
              fi
              if [ "$found" = false ]; then
                echo "BROKEN LINK in $(basename $f): $h"
                errors=$((errors + 1))
              fi
            done
          done
          if [ $errors -gt 0 ]; then
            echo "FAIL Found $errors broken link(s)"
            exit 1
          else
            echo "OK No broken internal links found"
          fi

      - name: Count deliverables
        run: |
          html=$(find . -name '*.html' -not -path './.git/*' | wc -l)
          css=$(find . -name '*.css' -not -path './.git/*' | wc -l)
          js=$(find . -name '*.js' -not -path './.git/*' | wc -l)
          total=$(find . -type f -not -path './.git/*' | wc -l)
          echo "Summary: $html HTML pages, $css CSS files, $js JS files ($total files total)"
